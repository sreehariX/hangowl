  <circle cx="80" cy="96" r="14" fill="#F0F0F5"/>
  <!-- Right eye white -->
  <circle cx="112" cy="96" r="14" fill="#F0F0F5"/>
  <!-- Left pupil -->
  <circle cx="82" cy="96" r="8" fill="#1A1A2E"/>
  <!-- Right pupil -->
  <circle cx="114" cy="96" r="8" fill="#1A1A2E"/>
  <!-- Left eye glint -->
  <circle cx="85" cy="93" r="3" fill="#F0F0F5"/>
  <!-- Right eye glint -->
  <circle cx="117" cy="93" r="3" fill="#F0F0F5"/>
  <!-- Beak -->
  <polygon points="96,106 90,114 102,114" fill="#F5A623"/>
  <!-- Feet -->
  <ellipse cx="84" cy="152" rx="10" ry="4" fill="#F5A623" opacity="0.7"/>
  <ellipse cx="108" cy="152" rx="10" ry="4" fill="#F5A623" opacity="0.7"/>
</svg>
