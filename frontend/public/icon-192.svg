<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="42" fill="#1A1A2E"/>
  <!-- Owl body silhouette -->
  <ellipse cx="96" cy="108" rx="48" ry="52" fill="#F5A623"/>
  <!-- Ear tufts -->
